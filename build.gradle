plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
}

// foaming-shores-fabric-26.3.X-v0.1.0.jar: loader, the Minecraft versions it serves, then the
// mod's own version (the naming publish.py and the other mods use).
def supportLabel = project.minecraft_support_range.trim().replaceAll(/(?i)\.x\b/, '.X')

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-${supportLabel}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"foamingshores" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// 26.3 dev clients die at random with exit 0xC0000005 and no hs_err:
	// HotSpot's guard-page repair strips PAGE_GUARD from a worker stack and a
	// later jvm!__chkstk walks off the committed part. Pre-touching every Java
	// thread stack sidesteps it. Dev-only: players launch through Mojang's launcher.
	runs {
		client {
			vmArgs("-XX:+UnlockDiagnosticVMOptions", "-XX:+AlwaysPreTouchStacks")
		}
	}
}

repositories {
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/" }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integrations: the settings screen. Compiled against, never required at runtime.
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_support_range", project.minecraft_support_range
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
			"minecraft_support_range": inputs.properties.minecraft_support_range
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName
	archiveVersion = "v${project.version}"

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
	archiveVersion = "v${project.version}"
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
